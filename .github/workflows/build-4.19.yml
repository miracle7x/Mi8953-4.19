name: Mi8953-4.19-BakaSU

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Codename device (dipakai untuk nama zip)"
        required: false
        default: "tissot"
      variant:
        description: "Varian build"
        required: true
        type: choice
        default: both
        options:
          - both
          - ksu
          - nonksu
  push:
    branches: [ bakasu-wip ]

env:
  ARCH: arm64
  SUBARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 1
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: 1
  KBUILD_BUILD_USER: server
  KBUILD_BUILD_HOST: build
  DEVICE: ${{ inputs.device || 'tissot' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: 🧮 Tentukan varian
        id: set
        run: |
          V="${{ inputs.variant || 'both' }}"
          case "$V" in
            ksu)    M='["ksu"]' ;;
            nonksu) M='["nonksu"]' ;;
            *)      M='["ksu","nonksu"]' ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: 🔥 Telegram Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="🚀 <b>Kernel CI started</b>%0A%0A<b>Device:</b> ${DEVICE}%0A<b>Varian:</b> ${VARIANT^^}%0A<b>Workflow:</b> ${{ github.workflow }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> <code>${GITHUB_SHA::7}</code>%0A<b>Run:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a>"

      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: ⚡ Clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ runner.os }}-proton-clang-master

      - name: ⚡ Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-mi8953-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-mi8953-${{ matrix.variant }}-

      - name: 🔧 Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev ccache zip libncurses6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true

      - name: ⚙ Toolchain
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          fi
          # Hapus binutils host bawaan proton agar memakai ld/as bawaan sistem
          rm -f clang/bin/ld clang/bin/as

      - name: 🔍 Detect defconfig
        run: |
          CFG_DIR=arch/arm64/configs/vendor
          DEFCONFIG="vendor/msm8953-perf_defconfig"
          FRAGMENT="vendor/mi8953.config"

          for f in "$CFG_DIR/msm8953-perf_defconfig" "$CFG_DIR/mi8953.config"; do
            if [ ! -f "$f" ]; then
              echo "File tidak ditemukan: $f. Isi $CFG_DIR:"
              ls "$CFG_DIR"
              exit 1
            fi
          done

          echo "Pakai defconfig: $DEFCONFIG + $FRAGMENT"
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "FRAGMENT=$FRAGMENT" >> $GITHUB_ENV

      # ===== Hanya varian KSU =====
      - name: 📥 Setup BakaSU + NoMount (KSU)
        if: matrix.variant == 'ksu'
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s v4.2.0-rc3
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s master

      # ===== Hanya varian NonKSU =====
      - name: 🧹 Pastikan tanpa KSU (NonKSU)
        if: matrix.variant == 'nonksu'
        run: |
          # Setup KSU tidak dijalankan. Jika ada config KSU tersisa di defconfig/fragment, cabut.
          for f in arch/arm64/configs/$DEFCONFIG arch/arm64/configs/$FRAGMENT; do
            sed -i '/^CONFIG_KSU/d;/^CONFIG_KPROBES_HOOK/d' "$f" || true
          done
          grep -rn "CONFIG_KSU" arch/arm64/configs/vendor || echo "Bersih dari CONFIG_KSU"

      - name: 🛠️ Build
        run: |
          export PATH="$PWD/clang/bin:$PATH"

          mkdir -p out
          JOBS=$(( $(nproc --all) * 2 ))

          MAKE_ARGS=(
            O=out
            CC="ccache clang"
            HOSTCC="ccache gcc"
            HOSTCXX="ccache g++"
          )

          make -j${JOBS} "${MAKE_ARGS[@]}" ${DEFCONFIG} ${FRAGMENT}
          make -j${JOBS} "${MAKE_ARGS[@]}" Image.gz-dtb

      - name: 📦 Package Anykernel3
        run: |
          git clone --depth=1 https://github.com/miracle7x/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/README.md anykernel/modules anykernel/patch anykernel/ramdisk

          sed -i "s/^kernel.string=.*/kernel.string=perf ${VARIANT^^} kernel ${DEVICE} by cappuccino/" anykernel/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel/anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=0/' anykernel/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb

          cd anykernel
          zip -r9 ../perf-${VARIANT}-Mi8953-${DEVICE}-$(date +'%Y%m%d').zip * -x .git README.md *placeholder

      - name: ⬇️ Upload
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.variant }}-Mi8953-${{ env.DEVICE }}
          path: perf-${{ matrix.variant }}-Mi8953-${{ env.DEVICE }}-*.zip

      - name: ⬇️ Telegram Upload
        run: |
          ZIP=$(ls perf-${VARIANT}-Mi8953-${DEVICE}-*.zip | head -n1)
          SIZE=$(du -h "$ZIP" | cut -f1)
          curl -s -F document=@"$ZIP" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F parse_mode="HTML" \
            -F caption=$'✅ <b>Kernel CI build success</b>\n\n<b>Device:</b> '"$DEVICE"$'\n<b>Varian:</b> '"${VARIANT^^}"$'\n<b>File:</b> '"$ZIP"$'\n<b>Size:</b> '"$SIZE"$'\n<b>Branch:</b> ${{ github.ref_name }}\n<b>Commit:</b> <code>'"${GITHUB_SHA::7}"$'</code>' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      - name: ❌ Telegram Failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Kernel CI build failed</b>%0A%0A<b>Device:</b> ${DEVICE}%0A<b>Varian:</b> ${VARIANT^^}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> <code>${GITHUB_SHA::7}</code>%0A<b>Log:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a>"
